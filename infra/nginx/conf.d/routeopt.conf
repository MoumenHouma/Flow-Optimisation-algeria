# Server blocks for RouteOpt (included by ../nginx.conf).
# Replace server_name and the certificate paths with your domain's values.

# HTTP → HTTPS redirect (leaves /healthz and ACME challenges on HTTP).
server {
    listen 80;
    server_name _;

    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.routeopt.dz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (docs/RULES.md §8.2).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Application + public partner API → FastAPI backend. Forwarding the real
    # client IP is required for the audit log (core/audit.client_ip).
    location /api/ {
        proxy_pass http://routeopt_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health/readiness probes (unversioned).
    location ~ ^/health {
        proxy_pass http://routeopt_backend;
        proxy_set_header Host $host;
    }

    # Everything else → static frontend (SPA fallback lives in its own nginx).
    location / {
        proxy_pass http://routeopt_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
