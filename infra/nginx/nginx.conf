# RouteOpt production reverse proxy (docs/DEPLOYMENT.md §5).
# Terminates TLS, serves the static frontend and proxies /api to the backend.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 12m;          # proof-of-delivery photo uploads (~10 MB)

    # Upstreams resolve to the compose service names (docker-compose.prod.yml).
    upstream routeopt_backend  { server backend:8000; }
    upstream routeopt_frontend { server frontend:5173; }

    include /etc/nginx/conf.d/*.conf;
}
