[project]
name = "routeopt-optimizer"
version = "1.0.0"
description = "RouteOpt VRP optimization worker (OR-Tools + OSRM)"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",     # geographic clustering for large instances (ARCHITECTURE §4.1)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
